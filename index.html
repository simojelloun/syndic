<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syndic de la résidence</title>
<meta name="theme-color" content="#0E3B40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Syndic">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column; the home screen opens on the building's
   facade at night, where a lit window is a lot whose dues are paid this month. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface2:#F5F8F7; --ink:#12242A;
  --muted:#56686E; --line:#D5DEDC; --accent:#0E5E63; --accent-soft:#D9ECEA; --on-accent:#FFFFFF;
  --wall:#0E3B40; --on-wall:#DCEDEA; --sun:#F0B93A;
  --ok:#1E7B4F; --warn:#A05F06; --crit:#B4362E;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1518; --surface:#14232A; --surface2:#1A2D35; --ink:#E8EFEE; --muted:#93A5A9;
    --line:#27404A; --accent:#5CC2BD; --accent-soft:#17383B; --on-accent:#062022;
    --wall:#0A2B30; --on-wall:#DCEDEA; --sun:#F0B93A;
    --ok:#5FCB94; --warn:#E3A548; --crit:#F0857C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1518; --surface:#14232A; --surface2:#1A2D35; --ink:#E8EFEE; --muted:#93A5A9;
  --line:#27404A; --accent:#5CC2BD; --accent-soft:#17383B; --on-accent:#062022;
  --wall:#0A2B30; --on-wall:#DCEDEA; --sun:#F0B93A;
  --ok:#5FCB94; --warn:#E3A548; --crit:#F0857C; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
.top{padding:14px 18px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font:700 22px/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.top span{font-size:13px;color:var(--muted);white-space:nowrap}
main>*{flex:none}
main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 150px;display:flex;flex-direction:column;gap:16px}
h2{font:700 18px/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:600 13px/1.2 var(--body);margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* bottom navigation */
.nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 8px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.fab{position:absolute;right:16px;bottom:84px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:14px 20px;box-shadow:0 6px 18px rgba(0,0,0,.22)}

/* facade */
.hero{background:var(--wall);color:var(--on-wall);border-radius:20px;padding:18px 16px 0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;font-weight:600}
.hero .big{font:700 24px/1.1 var(--display);margin-top:4px;text-wrap:balance}
.pct{white-space:nowrap;font:700 40px/1 var(--display);color:var(--sun);font-variant-numeric:tabular-nums}
.facade{display:flex;flex-direction:column;gap:6px}
.bloc-name{font-size:12px;opacity:.7;font-weight:600;margin-top:4px}
.roof{height:6px;border-radius:6px 6px 0 0;background:rgba(255,255,255,.16);margin:0 -4px}
.floor{display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.fl{width:34px;font-size:12px;opacity:.7;flex:none;font-variant-numeric:tabular-nums}
.wins{display:flex;flex-wrap:wrap;gap:6px}
.win{min-width:44px;height:40px;padding:0 6px;border-radius:7px 7px 2px 2px;border:1.5px solid transparent;font:700 13px var(--body);font-variant-numeric:tabular-nums}
.win.ok{background:var(--sun);color:#2B1F00;box-shadow:0 0 14px rgba(240,185,58,.35)}
.win.part{background:repeating-linear-gradient(135deg,rgba(240,185,58,.55) 0 6px,transparent 6px 12px);border-color:var(--sun);color:#fff}
.win.soon,.win.hors{background:rgba(0,0,0,.22);border:1.5px solid rgba(255,255,255,.2);color:rgba(255,255,255,.72)}
.win.due{background:rgba(0,0,0,.28);border:1.5px dashed #F2958C;color:#F9CFCA}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;padding:2px 0 14px;opacity:.9}
.legend i{display:inline-block;width:14px;height:12px;border-radius:3px 3px 1px 1px;margin-right:5px;vertical-align:-1px;border:1.5px solid transparent}
.legend .ok{background:var(--sun)} .legend .part{border-color:var(--sun);background:repeating-linear-gradient(135deg,rgba(240,185,58,.55) 0 3px,transparent 3px 6px)} .legend .due{border:1.5px dashed #F2958C} .legend .soon,.legend .hors{border:1.5px solid rgba(255,255,255,.4)}

/* tiles, cards, rows */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tile.wide{grid-column:1/-1}
.tile b{font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.crit b{color:var(--crit)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:36px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list li{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li[hidden]{display:none}
.row{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;text-align:left}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row b{font-weight:600;overflow-wrap:anywhere}
.row small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.badge{flex:none;min-width:42px;height:38px;padding:0 6px;border-radius:7px 7px 2px 2px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 14px var(--body);font-variant-numeric:tabular-nums}
.stripe{flex:none;width:5px}
.stripe.urgente{background:var(--crit)} .stripe.normale{background:var(--warn)} .stripe.basse{background:var(--line)}
.pill{flex:none;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.pill.crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 13%,var(--surface))}
.pill.neutral{color:var(--muted);background:var(--surface2);border:1px solid var(--line)}
.amount{flex:none;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.side{display:flex;align-items:center;padding-right:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn.danger{color:var(--crit)}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.card p{overflow-wrap:anywhere;white-space:pre-line}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px}
.note.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.empty{text-align:center;color:var(--muted);padding:22px 14px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:center}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg.two{grid-template-columns:1fr 1fr}
.list li.wrap{flex-wrap:wrap}
.list li.wrap .side{flex-basis:100%;padding:0 14px 12px 70px}
.mlist{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mlist span{font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;border:1px solid var(--crit);color:var(--crit);font-variant-numeric:tabular-nums}
.mlist span.part{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13.5px;min-height:36px}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month b{font:700 18px var(--display);text-transform:capitalize}
.month>button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px}
.month>button:disabled{opacity:.35;cursor:default}
.side .btns{flex-wrap:nowrap}
.month .mid{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:2px 4px;font-size:13.5px;text-decoration:underline;text-underline-offset:2px}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mchip{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-size:14px;text-transform:capitalize}
.mchip small{font-size:11.5px;font-weight:600;text-transform:none}
.mchip.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok);border-color:transparent}
.mchip.part{color:var(--warn);border:1.5px dashed var(--warn)}
.mchip.due{color:var(--crit);border-color:var(--crit)}
.mchip.soon,.mchip.hors{color:var(--muted)}
.mchip.now{box-shadow:0 0 0 2px var(--accent)}
.mchip:disabled{cursor:default}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.cat{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:8px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.ok{color:var(--ok)} .chip.part{color:var(--warn);border-style:dashed} .chip.due{color:var(--crit);border-color:var(--crit)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;overflow-wrap:anywhere}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 18px 22px;display:flex;flex-direction:column;gap:14px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet header button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-size:20px;line-height:1}
#sheet-body{display:flex;flex-direction:column;gap:14px}
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field[hidden]{display:none}
.field label{font-size:13.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:500;min-height:40px}
.check input{width:20px;height:20px}
textarea.copy{width:100%;min-height:170px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:14.5px;line-height:1.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 32px));top:12px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14.5px;z-index:20;text-align:center}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="app">
  <header class="top"><h1 id="res-name">Ma résidence</h1><span id="res-sub">Syndic</span></header>
  <main id="view" tabindex="-1"></main>
  <button class="fab" id="fab" hidden></button>
  <div class="toast" id="toast" role="status" hidden></div>
  <nav class="nav" aria-label="Sections">
    <a href="#accueil" data-tab="accueil"><svg viewBox="0 0 24 24"><path d="M4 21V5l8-2 8 2v16M9 21v-4h6v4M8 8h2M14 8h2M8 12h2M14 12h2"/></svg>Accueil</a>
    <a href="#lots" data-tab="lots"><svg viewBox="0 0 24 24"><path d="M15 3h4a1 1 0 0 1 1 1v17H9V4a1 1 0 0 1 1-1h1M4 21h17M13.5 12.5h.01M9 21V8l-4 1v12"/></svg>Lots</a>
    <a href="#caisse" data-tab="caisse"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Caisse</a>
    <a href="#incidents" data-tab="incidents"><svg viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19zM12 10v4M12 17h.01"/></svg>Incidents</a>
    <a href="#residence" data-tab="residence"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4zM8 9h8M8 12h5"/></svg>Résidence</a>
  </nav>
</div>
<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header><h2 id="sheet-title"></h2><button type="button" data-act="close" aria-label="Fermer">×</button></header>
    <div id="sheet-body"></div>
  </div>
</div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const thisMonth = () => today().slice(0, 7);
const frDate = d => d ? String(d).split('-').reverse().join('/') : '';
const monthLabel = (m, short) => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('fr-FR', { month: short ? 'short' : 'long', year: 'numeric' }); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 });
const money = n => nf.format(Math.round(num(n) * 100) / 100) + ' ' + (S.cfg.devise || 'DH');
const etageLabel = e => { const n = num(e); return n <= 0 ? 'RDC' : n === 1 ? '1er' : n + 'e'; };
const shift = (m, d) => { let [y, mo] = m.split('-').map(Number); mo += d; y += Math.floor((mo - 1) / 12); mo = ((mo - 1) % 12 + 12) % 12 + 1; return y + '-' + pad(mo); };
const natural = (a, b) => String(a).localeCompare(String(b), 'fr', { numeric: true });

/* ---------- state ---------- */
const COLS = ['lots', 'paiements', 'depenses', 'remboursements', 'incidents', 'annonces'];
const DEFCFG = { nom: 'Ma résidence', adresse: '', devise: 'DH', debut: thisMonth(), soldeInitial: 0, cotisationDefaut: 200 };
const S = { mode: 'loading', cfg: { ...DEFCFG }, admin: true, report: true, uid: null, stale: false, got: new Set() };
COLS.forEach(c => S[c] = []);
const ui = { tab: 'accueil', mois: null, seg: 'cotisations', lotVue: 'liste', depuis: null, depVue: 'mois', depFiltre: 'toutes' };
const TABS = ['accueil', 'lots', 'caisse', 'incidents', 'residence'];
const CATS = ['Nettoyage', 'Gardiennage', 'Électricité', 'Eau', 'Ascenseur', 'Entretien', 'Jardinage', 'Assurance', 'Divers'];
const MODES = ['Espèces', 'Virement', 'Chèque'];
let db = null;
const LS = 'syndic-local-v1';

/* ---------- storage ---------- */
function persistLocal() {
  try { const o = { cfg: S.cfg }; COLS.forEach(c => o[c] = S[c]); localStorage.setItem(LS, JSON.stringify(o)); } catch (e) {}
}
function loadLocal() {
  try { const o = JSON.parse(localStorage.getItem(LS) || 'null'); if (o) { S.cfg = { ...DEFCFG, ...o.cfg }; COLS.forEach(c => S[c] = Array.isArray(o[c]) ? o[c] : []); } } catch (e) {}
}
function fail(e) {
  const code = e && e.code;
  toast(code === 'quota_exceeded' ? 'Espace de stockage plein. Supprimez d’anciens éléments.'
    : code === 'invalid_argument' ? 'Modification refusée. Votre accès est peut-être en lecture seule.'
    : 'Enregistrement impossible. Réessayez dans un instant.');
}
async function save(col, existing, values) {
  const id = existing && existing.id ? existing.id : newId();
  const data = JSON.parse(JSON.stringify({ ...(existing || {}), ...values }));
  delete data.id; if (existing) delete data.exemple;
  if (S.mode === 'db') {
    try { await db.collection(col).doc(id).set(data); } catch (e) { fail(e); return null; }
  } else {
    const row = { id, ...data }, i = S[col].findIndex(d => d.id === id);
    if (i >= 0) S[col][i] = row; else S[col].push(row);
    persistLocal(); schedule();
  }
  return id;
}
async function remove(col, id) {
  if (S.mode === 'db') { try { await db.collection(col).doc(id).delete(); } catch (e) { fail(e); return false; } }
  else { S[col] = S[col].filter(d => d.id !== id); persistLocal(); schedule(); }
  return true;
}
async function saveCfg(values) {
  const data = JSON.parse(JSON.stringify({ ...S.cfg, ...values })); delete data.exemple;
  if (S.mode === 'db') { try { await db.doc('config/residence').set(data); } catch (e) { fail(e); return false; } }
  else { S.cfg = data; persistLocal(); schedule(); }
  return true;
}
function subscribe() {
  const total = COLS.length + 1;
  const timer = setTimeout(() => { S.stale = true; schedule(); }, 10000);
  const got = k => { S.got.add(k); if (S.got.size >= total) { clearTimeout(timer); S.stale = false; } schedule(); };
  COLS.forEach(c => db.collection(c).onSnapshot(
    snap => { S[c] = snap.docs.map(d => ({ id: d.id, ...d.data() })); got(c); },
    () => { S.broken = true; got(c); }));
  db.doc('config/residence').onSnapshot(
    snap => { S.cfg = { ...DEFCFG, ...(snap.exists ? snap.data() : {}) }; got('cfg'); },
    () => { S.broken = true; got('cfg'); });
}
async function boot() {
  route(); render();
  let user = null;
  try {

function months() {

  const r = new FileReader();
  r.onload = () => {
    let o = null; try { o = JSON.parse(r.result); } catch (err) {}
    e.target.value = '';
    if (!o || o.app !== 'syndic' || !Array.isArray(o.lots)) { toast('Ce fichier n’est pas une sauvegarde de l’application.'); return; }
    pendingRestore = o;
    openSheet('Restaurer la sauvegarde', `<p>Sauvegarde du ${esc(frDate((o.exporte || '').slice(0, 10)))} : ${o.lots.length} lots, ${(o.paiements || []).length} paiements, ${(o.depenses || []).length} dépenses.</p><p class="note warn">Les données actuelles de cet appareil seront remplacées.</p><div class="btns"><button class="btn danger" data-act="restore-go">Remplacer par la sauvegarde</button><button class="btn" data-act="close">Annuler</button></div>`);
  };
  r.readAsText(e.target.files[0]);
});
document.addEventListener('change', e => { if (e.target.id === 'depuis-sel') { ui.depuis = e.target.value; render(); const el = $('#depuis-sel'); if (el) el.focus(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#scrim').hidden) closeSheet(); });
document.addEventListener('input', e => {
  if (formCtx && formCtx.onInput && (e.target.id || '').startsWith('f-')) formCtx.onInput(e.target.id.slice(2));
  const L = { 'lot-search': '#lot-list', 'dep-search': '#dep-list' }[e.target.id]; if (!L) return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(L + ' li').forEach(li => li.hidden = !!q && !li.dataset.q.includes(q));
});
window.addEventListener('hashchange', () => { route(); render(); $('#view').scrollTop = 0; });
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
